services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: messjar
      POSTGRES_PASSWORD: messjar
      POSTGRES_DB: messjar
    ports:
      - "5434:5432"
    volumes:
      - messjar_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messjar -d messjar"]
      interval: 2s
      timeout: 5s
      retries: 15

  bus:
    build: .
    ports:
      - "7420:7420"
    environment:
      DATABASE_URL: postgresql://messjar:messjar@db:5432/messjar
      MESSJAR_PASSWORD: admin-optional
      PORT: "7420"
      HOST: "0.0.0.0"
    depends_on:
      db:
        condition: service_healthy

volumes:
  messjar_pg:
